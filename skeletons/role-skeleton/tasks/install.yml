---
# tasks/install.yml
#
# Package installation only. No configuration here.
# Separate concerns = separate files.
#
# 🐇 /explore package-management — state: present vs latest, version pinning

- name: "{{ role_name }} | Install packages"
  ansible.builtin.package:
    name: "{{ role_name_packages }}"
    state: "{{ role_name_package_state }}"

# If the role needs OS-specific packages:
# - name: "{{ role_name }} | Include OS-specific vars"
#   ansible.builtin.include_vars: "{{ ansible_os_family | lower }}.yml"
#
# Then create vars/RedHat.yml and vars/Debian.yml with
# role_name_packages: [list specific to that family]
