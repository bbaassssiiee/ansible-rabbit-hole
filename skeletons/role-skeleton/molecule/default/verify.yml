---
# molecule/default/verify.yml
#
# Assert actual state — not that tasks ran, but that the system is correct.
# This is where most roles are undertested. Be specific.
#
# The rule: if you deployed it, verify it.
# Package installed? Verify it.
# Service running? Verify it.
# Config file deployed? Verify the file exists AND a key value inside it.
# Port listening? Verify it.
#
# 🐇 /explore verify-patterns — what good verification looks like

- name: Verify
  hosts: all
  gather_facts: false

  tasks:
    # ── Package verification ──────────────────────────────────────────────
    - name: "Verify | Gather package facts"
      ansible.builtin.package_facts:
