---
# inventory-production/hosts.yml
#
# Production inventory. Static hosts defined here.
# For dynamic cloud inventory: replace with an inventory plugin config.
# 🐇 /explore inventory-plugins — ec2.yml, azure_rm.yml, constructed.yml

all:
  children:
    # ── Web tier ─────────────────────────────────────────────────────────
    webservers:
      hosts:
        prod-web-01.example.com:
        prod-web-02.example.com:
        prod-web-03.example.com:
      vars:
        # Tier-level vars go in group_vars/webservers/ — not here.
        # Only structural vars (ansible_user, ansible_port) belong inline.
        ansible_user: deploy
        ansible_port: 22

    # ── Database tier ────────────────────────────────────────────────────
    databases:
      hosts:
        prod-db-01.example.com:
          # Host-specific vars belong in host_vars/prod-db-01.yml — not here.
          # Exception: vars that distinguish one host from its siblings.
          db_role: primary
        prod-db-02.example.com:
          db_role: replica

    # ── Logical groupings (for targeting with --limit) ───────────────────
    production:
      children:
        webservers:
        databases:
