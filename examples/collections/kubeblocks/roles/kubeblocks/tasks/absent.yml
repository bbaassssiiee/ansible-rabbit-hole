---
# when: desired_state == 'absent'
- name: Remove directories
  when: delete_caches is defined
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ kubeblocks_repo }}"
    - "{{ kubeblocks_cache }}"

- name: Remove KubeBlocks
  ansible.builtin.command: >
    kbcli kubeblocks uninstall -n kb-system --auto-approve=true
  changed_when: true

- name: Remove KubeBlocks crds
  ansible.builtin.shell: |
    set -o pipefail;
    kubectl get crd -o name | grep kubeblocks.io | xargs kubectl delete
  changed_when: true
  failed_when: false  # for example rc 123 is empty list as inputs

- name: Remove kb-system
  kubernetes.core.k8s:
    name: kb-system
    api_version: v1
    kind: Namespace
    state: absent
    wait: true
